x-go-build: &go-build
  context: .
  args:
    GOPROXY: ${GOPROXY:-https://proxy.golang.org|https://goproxy.cn|direct}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-paradise_go}
      MYSQL_USER: ${MYSQL_USER:-sso}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: deploy/production.env
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD:?Set REDIS_PASSWORD}"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: *go-build
    image: paradise-sso-go:local
    command: migrate
    restart: "no"
    env_file: deploy/production.env
    environment:
      MYSQL_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
  api:
    stop_grace_period: 45s
    build: *go-build
    image: paradise-sso-go:local
    restart: unless-stopped
    env_file: deploy/production.env
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      MYSQL_HOST: mysql
      REDIS_ADDR: redis:6379
      OAUTH_PRIVATE_KEY_PATH: /run/sso-secrets/oauth-private.key
    volumes:
      - ./deploy/secrets:/run/sso-secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/readyz']
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    stop_grace_period: 45s
    build: *go-build
    image: paradise-sso-go:local
    command: worker
    restart: unless-stopped
    env_file: deploy/production.env
    environment:
      MYSQL_HOST: mysql
      REDIS_ADDR: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build:
      context: ../SSO-Paradise-Supply-Chain-Go-Front
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
        API_ORIGIN: http://api:8080
        PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:?Set WalletConnect project ID}
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      api:
        condition: service_healthy
volumes:
  mysql_data:
  redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.42.0/24
